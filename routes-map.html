window.addEventListener('load',function(){
  const map=L.map('map',{zoomControl:true,maxZoom:16});window.map=map;
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors',maxZoom:16}).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,pane:'shadowPane'}).addTo(map);
  const layers={},markers=[];let postersOnly=false;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  ROUTES.forEach(r=>{
    const g=L.layerGroup();const line=r.locs.filter(x=>!x.skip);const seen={};const pts=[];
    line.forEach(x=>{if(!seen[x.seq]){seen[x.seq]=1;pts.push(x.gps);}});
    if(pts.length>1)L.polyline(pts.concat([pts[0]]),{color:r.color,weight:3,opacity:.75}).addTo(g);
    const off={};
    r.locs.forEach(x=>{
      const n=off[x.seq]=(off[x.seq]||0)+1;
      const has=x.poster?'up':(x.room==='y'?'room':'');
      const html='<div class="mk'+(x.skip?' skip':'')+'"><div class="c" style="background:'+r.color+'">'+esc(x.seq)+'</div>'+(has?'<span class="pb '+has+'"></span>':'')+'</div>';
      const ll=[x.gps[0]+(n-1)*0.00012,x.gps[1]+(n-1)*0.00012];
      const m=L.marker(ll,{icon:L.divIcon({html:html,className:'',iconSize:[24,24],iconAnchor:[12,12]})});
      let p='<div class="pp"><b>'+esc(x.seq)+' · '+esc(x.name)+'</b>'+(x.skip?' <i>(skip)</i>':'')+'<br>'+esc(x.addr)+'<div class="r">Route '+esc(r.label)+' · '+esc(r.name)+(r.who?' · '+esc(r.who):'')+'</div>';
      if(x.poster)p+='<div class="p">Poster up: '+esc(x.poster)+'</div>';else if(x.room==='y')p+='<div class="p">Room for poster</div>';
      p+='</div>';m.bindPopup(p);m.on('mouseover',()=>m.openPopup());
      m._has=!!has;m.addTo(g);markers.push(m);
    });
    layers[r.label]=g;g.addTo(map);
    const row=document.createElement('label');row.className='rt';
    row.innerHTML='<input type="checkbox" checked data-r="'+esc(r.label)+'"><span class="sw" style="background:'+r.color+'"></span><span><b>'+esc(r.label)+'</b> '+esc(r.name)+'<small>'+(r.who?esc(r.who):'nobody assigned')+' · <a href="'+esc(r.url)+'" target="_blank" rel="noopener">Google Maps</a></small></span>';
    row.querySelector('input').addEventListener('change',e=>{e.target.checked?g.addTo(map):map.removeLayer(g);});
    document.getElementById('list').appendChild(row);
  });
  function fitAll(){const b=L.latLngBounds([]);Object.keys(layers).forEach(k=>{if(map.hasLayer(layers[k]))layers[k].eachLayer(l=>{if(l.getLatLng)b.extend(l.getLatLng());});});if(b.isValid())map.fitBounds(b,{padding:[30,30]});}
  function selectAll(on){document.querySelectorAll('#list input').forEach(i=>{i.checked=on;const g=layers[i.dataset.r];on?g.addTo(map):map.removeLayer(g);});if(on)fitAll();}
  function togglePosters(){postersOnly=!postersOnly;document.getElementById('pbtn').classList.toggle('on',postersOnly);markers.forEach(m=>{const el=m.getElement&&m.getElement();if(el)el.firstChild.classList.toggle('dim',postersOnly&&!m._has);});}
  map.on('layeradd',()=>{if(postersOnly)markers.forEach(m=>{const el=m.getElement&&m.getElement();if(el)el.firstChild.classList.toggle('dim',!m._has);});});
  window.fitAll=fitAll;window.selectAll=selectAll;window.togglePosters=togglePosters;
  fitAll();
});
